---

console-api-session:
  path: /api/session
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\Api\SessionController::show'
  }
  methods: [GET]

console-api-entities:
  path: /api/entities/{set}
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\Api\EntityListController::list'
  }
  requirements:
    set: saml20-sp-remote
  methods: [GET]

console-migrate:
  path: /migrate
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\MigrateController::run'
  }
  methods: [POST]

console-entity-new:
  path: /entities/{set}/new
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\EntityEditController::add'
  }
  requirements:
    set: saml20-sp-remote
  methods: [GET]

console-entity-edit:
  path: /entities/{set}/edit
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\EntityEditController::edit'
  }
  requirements:
    set: saml20-sp-remote
  methods: [GET]

console-entity-save:
  path: /entities/{set}/save
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\EntitySaveController::save'
  }
  requirements:
    set: saml20-sp-remote
  methods: [POST]

console-publish:
  path: /publish
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\PublishController::review'
  }
  methods: [GET]

console-publish-confirm:
  path: /publish
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\PublishController::publish'
  }
  methods: [POST]

console-entity-delete:
  path: /entities/{set}/delete
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\EntityDeleteController::delete'
  }
  requirements:
    set: saml20-sp-remote
  methods: [POST]

# Last: every other GET that is not under api/ or assets/ is a screen of the client router.
console-shell:
  path: /{path}
  defaults: {
    _controller: 'SimpleSAML\Module\console\Controller\ShellController::show',
    path: ''
  }
  requirements:
    path: '(?!api(?:/|$)|assets/).*'
  methods: [GET]
