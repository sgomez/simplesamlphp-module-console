<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Database update</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./console.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="ui {{theme}} shell" style="display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg); position: relative">
<div id="nav" class="shell-side" style="flex: 1 1 232px; max-width: 100%; background: var(--side); border-inline-end: 1px solid var(--border)">
<dc-import name="Sidebar" active="overview" mode="console" theme="{{theme}}" bare="{{ true }}" hint-size="232px,760px"></dc-import>
</div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
<header style="display: flex; align-items: center; flex-wrap: wrap; gap: 12px 16px; padding: 12px 32px; min-height: 56px; border-bottom: 1px solid var(--border)">
<a class="menu-btn btn btn-secondary btn-icon" href="#nav" aria-label="Menu"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M2 4h12M2 8h12M2 12h12"></path></svg></a>
<nav aria-label="Breadcrumb" style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 13px; flex: 1 1 auto; min-width: 0">
<a class="crumb" href="Main.dc.html">Console</a><span aria-hidden="true" class="faint">/</span><span aria-current="page" style="font-weight: 600">Database update</span>
</nav>

</header>
<main style="display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 760px; padding: 32px 32px 64px; flex: 1 0 auto">
<div class="card empty" style="margin-top: 48px"><h1 class="h1">The database needs an update</h1><p class="muted" style="margin: 0; max-width: 52ch">The module was upgraded to 1.4. Nodes keep serving Snapshot #41 meanwhile.</p><button class="btn btn-primary" type="button">Update database</button><span class="small muted">3 steps · about a second</span></div>
</main>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":700}}'>
class Component extends DCLogic {
renderVals() {
return { theme: this.props.theme ?? 'light' };
}
}
</script>
</body>
</html>
