name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: ctype, curl, dom, filter, hash, iconv, intl, json, libxml, mbstring, openssl, pcre, pdo_mysql, pdo_pgsql, pdo_sqlite, session, simplexml, spl, xml, zlib

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer stan
      - run: composer cs
      - run: composer size

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CONSOLE_TEST_DB_USER: console
      CONSOLE_TEST_DB_PASSWORD: console
      CONSOLE_TEST_DSN_SQLITE: 'sqlite::memory:'
      CONSOLE_TEST_DSN_POSTGRES: 'pgsql:host=127.0.0.1;port=5432;dbname=console'
      CONSOLE_TEST_DSN_MARIADB: 'mysql:host=127.0.0.1;port=3306;dbname=console;charset=utf8mb4'
      CONSOLE_TEST_DSN_MARIADB_NEWEST: 'mysql:host=127.0.0.1;port=3307;dbname=console;charset=utf8mb4'
      CONSOLE_TEST_DSN_MYSQL: 'mysql:host=127.0.0.1;port=3308;dbname=console;charset=utf8mb4'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: console
          POSTGRES_PASSWORD: console
          POSTGRES_DB: console
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U console"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_USER: console
          MARIADB_PASSWORD: console
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: console
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb-newest:
        image: mariadb:11.8
        env:
          MARIADB_USER: console
          MARIADB_PASSWORD: console
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: console
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: console
          MYSQL_PASSWORD: console
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: console
        ports: ['3308:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer coverage

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer mutate

  full-suite:
    name: Full suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer test

  lowest-dependencies:
    name: Lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - run: composer test

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer audit --locked

  codeql:
    name: CodeQL (workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: actions
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:actions

  ci:
    name: CI
    if: always()
    needs:
      - static-analysis
      - coverage
      - mutation
      - full-suite
      - lowest-dependencies
      - composer-audit
      - codeql
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
