name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PHP_EXTENSIONS: ctype, curl, dom, filter, hash, iconv, intl, json, libxml, mbstring, openssl, pcre, pdo_mysql, pdo_pgsql, pdo_sqlite, session, simplexml, spl, xml, zlib

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer stan
      - run: composer cs
      - run: composer size

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CONSOLE_TEST_DB_USER: console
      CONSOLE_TEST_DB_PASSWORD: console
      CONSOLE_TEST_DSN_SQLITE: 'sqlite::memory:'
      CONSOLE_TEST_DSN_POSTGRES: 'pgsql:host=127.0.0.1;port=5432;dbname=console'
      CONSOLE_TEST_DSN_MARIADB: 'mysql:host=127.0.0.1;port=3306;dbname=console;charset=utf8mb4'
      CONSOLE_TEST_DSN_MARIADB_NEWEST: 'mysql:host=127.0.0.1;port=3307;dbname=console;charset=utf8mb4'
      CONSOLE_TEST_DSN_MYSQL: 'mysql:host=127.0.0.1;port=3308;dbname=console;charset=utf8mb4'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: console
          POSTGRES_PASSWORD: console
          POSTGRES_DB: console
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U console"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_USER: console
          MARIADB_PASSWORD: console
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: console
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb-newest:
        image: mariadb:11.8
        env:
          MARIADB_USER: console
          MARIADB_PASSWORD: console
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: console
        ports: ['3307:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_USER: console
          MYSQL_PASSWORD: console
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: console
        ports: ['3308:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer coverage

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --no-progress
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/pestphp/pest-plugin-mutate/.temp/pest-mutate-cache
          key: pest-mutate-${{ hashFiles('composer.lock', 'src/**', 'tests/**') }}
          restore-keys: pest-mutate-
      - run: composer mutate

  full-suite:
    name: Full suite (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      - run: composer test

  lowest-dependencies:
    name: Lowest dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer
      - run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
      - run: composer test

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: composer
      - run: composer audit --locked

  frontend:
    name: Front end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node
      - run: npm ci --ignore-scripts
      - run: npm run generate
      - name: The generated types and validators are up to date
        run: |
          git status --porcelain -- frontend/src/domain/documents/generated
          test -z "$(git status --porcelain -- frontend/src/domain/documents/generated)"
      - run: npm run lint
      - run: npm run typecheck
      - name: Chromium for the story tests, at the version the lock file pins
        run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - name: The committed build is up to date
        run: |
          git status --porcelain -- public/assets/app
          test -z "$(git status --porcelain -- public/assets/app)"


  package-contents:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The archive ships the built front end and the schemas, and no front-end sources
        run: |
          git archive HEAD | tar -t > "$RUNNER_TEMP/contents.txt"
          grep -qx 'public/assets/app/.vite/manifest.json' "$RUNNER_TEMP/contents.txt"
          grep -q '^public/assets/app/assets/' "$RUNNER_TEMP/contents.txt"
          grep -q '^docs/spec/schemas/' "$RUNNER_TEMP/contents.txt"
          if grep -E '^(frontend/|\.storybook/|node_modules/|package\.json$|package-lock\.json$)' "$RUNNER_TEMP/contents.txt"; then
            exit 1
          fi

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install_args: node
      - run: npm audit --omit=dev

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4
        with:
          category: /language:${{ matrix.language }}

  ci:
    name: CI
    if: always()
    needs:
      - static-analysis
      - coverage
      - mutation
      - full-suite
      - lowest-dependencies
      - composer-audit
      - frontend
      - package-contents
      - npm-audit
      - codeql
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required job finished with: $result"
              exit 1
            fi
          done
